
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Authentication{% endblock %} | Requisition System</title>

    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="rs-auth-body">

    <main class="rs-auth-container">

        <div class="rs-auth-brand mb-4 text-center">
            <i class="bi bi-box-seam fs-1"></i>
            <h3>Requisition System</h3>
            <p class="text-muted">Internal Procurement Management</p>
        </div>

        {% block auth_content %}{% endblock %}

    </main>

    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
