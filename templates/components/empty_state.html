
<div class="rs-panel text-center py-5">
    <div class="mb-3">
        <i class="bi {{ icon|default:'bi-inbox' }} fs-1 text-muted"></i>
    </div>

    <h5>{{ title|default:"No records found" }}</h5>

    <p class="text-muted mb-0">
        {{ description|default:"There is currently no data to display." }}
    </p>

    {% if action_url and action_label %}
        <a href="{{ action_url }}" class="btn btn-primary mt-3">
            {{ action_label }}
        </a>
    {% endif %}
</div>
