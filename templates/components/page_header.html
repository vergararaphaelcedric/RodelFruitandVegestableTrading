
<div class="rs-page-header">
    <div>
        <h1 class="rs-page-title">{{ page_title|default:"Dashboard" }}</h1>

        {% if page_description %}
            <p class="rs-page-description">{{ page_description }}</p>
        {% endif %}
    </div>

    {% if page_action_url and page_action_label %}
        <a href="{{ page_action_url }}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            {{ page_action_label }}
        </a>
    {% endif %}
</div>
