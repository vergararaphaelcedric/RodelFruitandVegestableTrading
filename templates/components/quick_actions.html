
<div class="rs-panel">
    <h5 class="mb-3">Quick Actions</h5>

    {% if actions %}
        <div class="d-grid gap-2">
            {% for action in actions %}
                <a
                    href="{{ action.url }}"
                    class="btn btn-outline-primary text-start"
                >
                    {% if action.icon %}
                        <i class="bi {{ action.icon }} me-2"></i>
                    {% endif %}
                    {{ action.label }}
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted mb-0">
            No quick actions are available yet.
        </p>
    {% endif %}
</div>
