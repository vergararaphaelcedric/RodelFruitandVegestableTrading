
<div class="dropdown">
    <button
        class="btn btn-light dropdown-toggle d-flex align-items-center gap-2"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
    >
        <span class="rs-avatar">{{ ui_initials }}</span>

        <span class="text-start">
            <strong class="d-block">{{ request.user.get_full_name|default:request.user.username }}</strong>
            <small class="text-muted">{{ request.user.get_role_display }}</small>
        </span>
    </button>

    <ul class="dropdown-menu dropdown-menu-end shadow">
        <li>
            <a class="dropdown-item" href="{% url 'password-change' %}">
                <i class="bi bi-key me-2"></i> Change Password
            </a>
        </li>

        <li><hr class="dropdown-divider"></li>

        <li>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item text-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                </button>
            </form>
        </li>
    </ul>
</div>
