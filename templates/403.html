
{% extends "base.html" %}

{% block title %}403 | Access Denied{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="rs-panel text-center mx-auto" style="max-width: 600px;">

        <div class="rs-stat-icon mx-auto mb-3">
            <i class="bi bi-shield-lock"></i>
        </div>

        <h1 class="display-4 fw-bold">403</h1>

        <h4 class="mb-3">Access Denied</h4>

        <p class="text-muted">
            You do not have permission to access this page.
            Please contact your system administrator if you believe
            this is a mistake.
        </p>

        <a href="{% url 'home' %}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-2"></i>
            Return to Dashboard
        </a>

    </div>
</div>

{% endblock %}
